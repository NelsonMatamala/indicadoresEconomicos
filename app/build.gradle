apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def adMobAppId = localProps.getProperty("ADMOB_APP_ID", "ca-app-pub-3940256099942544~3347511713")
def adMobBannerId = localProps.getProperty("ADMOB_BANNER_ID", "ca-app-pub-3940256099942544/6300978111")

def adMobTestAppId = "ca-app-pub-3940256099942544~3347511713"
def adMobTestBannerId = "ca-app-pub-3940256099942544/6300978111"

def keystorePath = localProps.getProperty("KEYSTORE_PATH", "")
def keystorePassword = localProps.getProperty("KEYSTORE_PASSWORD", "")
def keystoreAlias = localProps.getProperty("KEY_ALIAS", "")
def keystoreKeyPassword = localProps.getProperty("KEY_PASSWORD", "")

android {
    namespace "cl.nelsonmc.indicadores"
    compileSdk 36

    defaultConfig {
        applicationId "cl.nelsonmc.indicadores"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [ADMOB_APP_ID: adMobTestAppId]
        resValue "string", "admob_banner_id", adMobTestBannerId
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (keystorePath && keystorePassword && keystoreAlias && keystoreKeyPassword) {
                def keystoreFile = new File(keystorePath)
                if (!keystoreFile.exists()) {
                    throw new GradleException("STORE_FILE no existe: ${keystorePath}. Verifica local.properties")
                }
                storeFile keystoreFile
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePath && keystorePassword && keystoreAlias && keystoreKeyPassword) {
                signingConfig signingConfigs.release
            }
            manifestPlaceholders = [ADMOB_APP_ID: adMobAppId]
            resValue "string", "admob_banner_id", adMobBannerId
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    annotationProcessor 'androidx.lifecycle:lifecycle-compiler:2.2.0'

    implementation 'com.google.android.material:material:1.2.0-alpha02'
    implementation 'com.jakewharton.threetenabp:threetenabp:1.3.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation 'com.google.android.gms:play-services-ads:24.7.0'
    implementation 'com.google.firebase:firebase-analytics:21.3.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.5.0'
    implementation 'com.squareup.okhttp3:okhttp:3.3.1'

    // Dagger 2
    implementation 'com.google.dagger:dagger:2.20'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.20'

    // RxJava / RxAndroid
    implementation 'io.reactivex.rxjava2:rxjava:2.2.17'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}